name: tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run ci:test
      - name: Cache Lua Language Server
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/lua-language-server
          key: luals-${{ runner.os }}-${{ hashFiles('__tests__/luals/lua-language-server.ts') }}
      - name: Run Lua Language Server annotation tests
        run: npm run test:luals
      - uses: coverallsapp/github-action@v2
